services:
  imapsync-manager:
    build: .
    image: imapsync-manager:latest
    container_name: imapsync-manager
    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:
      - TZ=${TZ:-Europe/Paris}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}

    volumes:
      - /opt/imapsyncmanager:/app/data

    networks:
      - proxy-net

    labels:
      - "caddy=${CADDY_URL}"
      - "caddy.reverse_proxy={{upstreams 8080}}"
      - "caddy.basicauth=/*"
      - "caddy.basicauth.${CADDY_USER}=${CADDY_AUTH_HASH}"

networks:
  proxy-net:
    external: true
