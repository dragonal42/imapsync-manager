services:
  imapsync-manager:
    build: .
    image: imapsync-manager:latest
    container_name: imapsync-manager
    restart: unless-stopped

    ports:
      - "${PORTSYNC:-8081}:8080"

    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:?Définissez ADMIN_EMAIL dans .env}
      - PUBLIC_URL=${PUBLIC_URL:?Définissez PUBLIC_URL avec une origine HTTPS}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - TZ=${TZ:-Europe/Paris}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}

    volumes:
      - /opt/imapsyncmanager:/app/data

    networks:
      - proxy-net

    labels:
      - "caddy=${CADDY_URL}"
      - "caddy.reverse_proxy={{upstreams 8080}}"

networks:
  proxy-net:
    external: true
