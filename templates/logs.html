{% extends 'base.html' %}{% block content %}<section><h1>{{ run.label }}</h1><p>{{ run.status }} · {{ run.started|datetime_seconds }} · {{ run.actor }}</p><pre>{{ run.log or 'Exécution en cours.' }}</pre><div class="actions"><a href="/dashboard">Retour à l’historique</a><form class="action-form" method="post" action="/logs/delete/{{ run.id }}" data-confirm="Supprimer ce journal ?" data-toast="Journal supprimé" data-redirect="/dashboard"><button class="danger">Supprimer le journal</button></form></div></section>{% endblock %}
