{% extends 'base.html' %}{% block content %}<section><h1>{{ run.label }}</h1><p><span id="run-status">{{ "OK" if run.status == "Succès" else run.status }}</span> · {{ run.started|datetime_seconds }} · {{ run.actor }}</p><pre id="run-log" data-run-id="{{ run.id }}" data-active="{{ 1 if run.status == 'Synchronisation...' else 0 }}">{{ run.log or 'Exécution en cours.' }}</pre><div class="actions"><a href="/dashboard">Retour à l’historique</a><form class="action-form" method="post" action="/logs/delete/{{ run.id }}" data-confirm="Supprimer ce journal ?" data-toast="Journal supprimé" data-redirect="/dashboard"><button class="danger">Supprimer le journal</button></form></div></section><script defer src="/static/logs.js"></script>{% endblock %}
