{% extends 'base.html' %}{% block content %}<section><h1>Messagerie connectée</h1><p>Vous pouvez fermer cette fenêtre et enregistrer votre configuration.</p></section>
<script>if(window.opener && window.opener.location.origin === {{ public_url|tojson }}) {const target={{ target|tojson }};const doc=window.opener.document;doc.getElementById(target).value={{ tokens.access_token|tojson }};doc.getElementById('refresh_'+target).value={{ tokens.refresh_token|tojson }};doc.getElementById('provider_'+target).value={{ provider|tojson }};doc.getElementById('status_'+target).textContent='Connexion réussie. Enregistrez la configuration.';window.close();}</script>{% endblock %}
