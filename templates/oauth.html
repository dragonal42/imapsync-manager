{% extends 'base.html' %}{% block content %}<section><h1>{{ 'Connexion impossible' if error else 'Messagerie connectée' }}</h1><p class="oauth-status {{ 'oauth-error' if error else 'oauth-success' }}">{{ error if error else 'Connexion réussie. Vous pouvez enregistrer votre configuration !' }}</p></section>
<script>if(window.opener) {window.opener.postMessage({type:'imapsync-oauth', target:{{ target|tojson }}, provider:{{ provider|tojson }}, tokens:{{ tokens|tojson }}, error:{{ error|tojson }}}, {{ public_url|tojson }}); window.close();}</script>{% endblock %}
